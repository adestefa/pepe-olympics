<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Pepe — retopology comparison</title><style>*{box-sizing:border-box}body{margin:0;padding:28px;background:#f1f1e8;color:#233d31;font:15px system-ui}header{max-width:1400px;margin:0 auto 24px}h1{font-size:32px;margin:0 0 8px}p{line-height:1.6;color:#637461}main{max-width:1400px;margin:auto;display:grid;grid-template-columns:1fr 1fr;gap:20px}figure{margin:0;background:#fff;border-radius:12px;overflow:hidden}figcaption{padding:16px;font-weight:700}img{width:100%;display:block}button{font:inherit;padding:10px 16px;background:#294333;color:#eef4df;border:0;border-radius:5px;cursor:pointer;margin:10px 12px 0 0}#stats{font-variant-numeric:tabular-nums}@media(max-width:680px){main{grid-template-columns:1fr}}</style><header><h1>Pepe: original → quad retopology</h1><p>The original remains untouched. A new quad surface is projected onto the original and receives newly baked color, normal, roughness and metallic maps.</p><p id="stats">Original: 1,959,704 triangles. Retopology statistics are in retopology-report.json.</p><button id="toggle">Show quad edges</button><button onclick="document.querySelector('main').style.maxWidth=document.querySelector('main').style.maxWidth?'':'none'">Toggle large view</button></header><main><figure><figcaption>Original Tripo model</figcaption><img src="original.png" alt="Original high-resolution frog model"></figure><figure><figcaption id="caption">Retopologized model with baked detail</figcaption><img id="result" src="retopologized.png" alt="Lower-density retopologized frog model"></figure></main><script>let wire=false;document.getElementById('toggle').onclick=()=>{wire=!wire;document.getElementById('result').src=wire?'retopology-wire.png':'retopologized.png';document.getElementById('toggle').textContent=wire?'Show shaded model':'Show quad edges';document.getElementById('caption').textContent=wire?'Actual quad mesh edges':'Retopologized model with baked detail';};fetch('retopology-report.json').then(r=>r.json()).then(r=>{document.getElementById('stats').textContent=`Original: ${r.source_triangles.toLocaleString()} triangles · Retopology: ${r.retopo_quads.toLocaleString()} quads / ${r.render_triangles.toLocaleString()} rendered triangles · GLB: ${(r.optimized_bytes/1048576).toFixed(1)} MB`;}).catch(()=>{});</script></html>
